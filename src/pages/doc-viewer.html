<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuoNic Documentation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        doc: { bg: '#1a1b26', surface: '#1e1f2e', border: '#2a2b3d', text: '#c8cad3', dim: '#8b8fa3', accent: '#7aa2f7', accent2: '#9d7cd8', green: '#9ece6a', code: '#15161e' }
                    },
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'], mono: ['JetBrains Mono', 'Fira Code', 'monospace'] }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; background: #1a1b26; color: #c8cad3; line-height: 1.8; }
        code, pre { font-family: 'JetBrains Mono', monospace; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #1a1b26; }
        ::-webkit-scrollbar-thumb { background: #2a2b3d; border-radius: 3px; }
        .markdown-body h1 { font-size: 2rem; font-weight: 700; color: white; margin-bottom: 0.5rem; }
        .markdown-body h2 { font-size: 1.5rem; font-weight: 600; color: #7aa2f7; margin: 2rem 0 0.75rem; padding-bottom: 0.5rem; border-bottom: 1px solid #2a2b3d; }
        .markdown-body h3 { font-size: 1.1rem; font-weight: 600; color: #9d7cd8; margin: 1.5rem 0 0.5rem; }
        .markdown-body p { margin-bottom: 1rem; }
        .markdown-body pre { background: #15161e; padding: 1rem; border-radius: 8px; border: 1px solid #2a2b3d; overflow-x: auto; margin: 1rem 0; }
        .markdown-body code { background: #15161e; padding: 2px 6px; border-radius: 4px; font-size: 0.85em; color: #9ece6a; }
        .markdown-body pre code { background: none; padding: 0; color: #c8cad3; }
        .markdown-body table { width: 100%; border-collapse: collapse; margin: 1rem 0; }
        .markdown-body th, .markdown-body td { padding: 0.5rem 1rem; border-bottom: 1px solid #2a2b3d; text-align: left; font-size: 0.9rem; }
        .markdown-body th { background: #15161e; color: #7aa2f7; font-weight: 600; }
        .markdown-body ul, .markdown-body ol { margin: 0.5rem 0 1rem 1.5rem; }
        .markdown-body li { margin-bottom: 0.25rem; }
        .markdown-body blockquote { border-left: 4px solid #7aa2f7; padding: 0.5rem 1rem; margin: 1rem 0; background: rgba(122,162,247,0.05); }
        .markdown-body a { color: #7aa2f7; text-decoration: none; }
        .markdown-body a:hover { text-decoration: underline; }
        .markdown-body img { max-width: 100%; border-radius: 8px; }
    </style>
</head>
<body class="antialiased">

    <!-- Nav -->
    <header class="sticky top-0 z-50 bg-doc-bg/95 backdrop-blur border-b border-doc-border">
        <div class="max-w-screen-2xl mx-auto px-4 h-14 flex items-center justify-between">
            <div class="flex items-center gap-4">
                <a href="index.html" class="text-lg font-bold text-white flex items-center gap-2">
                    <span class="w-7 h-7 rounded-lg bg-gradient-to-tr from-blue-500 to-purple-500 flex items-center justify-center text-xs font-bold text-white">Q</span>
                    QuoNic
                </a>
                <span class="text-xs bg-doc-accent/10 text-doc-accent px-2 py-0.5 rounded font-mono border border-doc-accent/20">v0.11.0</span>
            </div>
            <div class="flex items-center gap-4">
                <button id="lang-toggle" onclick="toggleLang()" class="text-sm text-doc-dim hover:text-doc-accent transition-colors px-3 py-1.5 rounded-lg border border-doc-border hover:border-doc-accent flex items-center gap-1.5">
                    <i class="fa-solid fa-globe text-xs"></i>
                    <span id="lang-label">EN</span>
                </button>
                <a href="docs.html" class="text-sm text-doc-accent font-medium">Docs Home</a>
                <a href="index.html" class="text-sm text-doc-dim hover:text-doc-accent transition-colors">Home</a>
                <a href="https://github.com/ChrisLee0721/QuoNic" class="text-sm text-doc-dim hover:text-doc-accent transition-colors flex items-center gap-1">
                    <i class="fa-brands fa-github"></i> GitHub
                </a>
            </div>
        </div>
    </header>

    <div class="max-w-screen-2xl mx-auto flex">
        <!-- Sidebar (auto-generated from manifest.json) -->
        <aside class="w-64 shrink-0 border-r border-doc-border h-[calc(100vh-3.5rem)] overflow-y-auto sticky top-14 p-4 hidden lg:block">
            <nav class="space-y-6 text-sm" id="sidebar">
                <div class="text-doc-dim text-xs">Loading...</div>
            </nav>
        </aside>

        <!-- Content -->
        <main class="flex-1 min-w-0 p-8 lg:p-12 max-w-4xl">
            <div id="loading" class="text-doc-dim text-sm">Loading...</div>
            <div id="content" class="markdown-body" style="display:none"></div>
        </main>

        <!-- Right TOC -->
        <aside class="w-48 shrink-0 hidden xl:block sticky top-14 h-[calc(100vh-3.5rem)] overflow-y-auto p-4">
            <div class="text-xs font-semibold text-white uppercase tracking-wider mb-3">On this page</div>
            <nav id="toc" class="space-y-1 text-xs"></nav>
        </aside>
    </div>

    <script>
        // Configure marked
        marked.setOptions({
            highlight: function(code, lang) {
                return code;
            },
            breaks: true,
            gfm: true
        });

        // Load sidebar from manifest
        fetch('docs/manifest.json')
            .then(r => r.json())
            .then(manifest => {
                const sidebar = document.getElementById('sidebar');
                sidebar.innerHTML = '';
                manifest.sections.forEach(section => {
                    const div = document.createElement('div');
                    div.innerHTML = `<div class="text-xs font-semibold text-doc-dim uppercase tracking-wider mb-2">${section.title}</div>`;
                    section.items.forEach(item => {
                        const a = document.createElement('a');
                        a.href = `doc-viewer.html?file=${item.file}`;
                        a.textContent = item.title;
                        a.className = 'block px-3 py-1.5 rounded-lg text-doc-dim hover:text-doc-text hover:bg-doc-surface transition-colors';
                        div.appendChild(a);
                    });
                    sidebar.appendChild(div);
                });

                // Highlight active link
                const params = new URLSearchParams(window.location.search);
                const filePath = params.get('file');
                if (filePath) {
                    sidebar.querySelectorAll('a').forEach(a => {
                        if (a.href.includes(filePath)) {
                            a.classList.add('text-doc-accent', 'bg-doc-accent/10', 'font-medium');
                            a.classList.remove('text-doc-dim');
                        }
                    });
                }
            })
            .catch(() => {
                document.getElementById('sidebar').innerHTML = '<div class="text-doc-dim text-xs">Could not load docs manifest</div>';
            });

        // Language toggle
        let currentLang = 'en';

        function toggleLang() {
            currentLang = currentLang === 'en' ? 'zh' : 'en';
            document.getElementById('lang-label').textContent = currentLang === 'en' ? 'EN' : '中文';

            // Update sidebar links
            document.querySelectorAll('#sidebar a').forEach(a => {
                const href = a.getAttribute('href');
                if (currentLang === 'zh') {
                    // Switch to Chinese: add _zh before .md
                    a.setAttribute('href', href.replace('.md', '_zh.md'));
                } else {
                    // Switch to English: remove _zh
                    a.setAttribute('href', href.replace('_zh.md', '.md'));
                }
            });

            // Reload current document
            const params = new URLSearchParams(window.location.search);
            const filePath = params.get('file');
            if (filePath) {
                let newFile = filePath;
                if (currentLang === 'zh') {
                    newFile = filePath.replace('.md', '_zh.md');
                } else {
                    newFile = filePath.replace('_zh.md', '.md');
                }
                window.location.search = '?file=' + newFile;
            }
        }

        // Get file path from URL
        const params = new URLSearchParams(window.location.search);
        const filePath = params.get('file');

        if (filePath) {
            // Fetch and render Markdown
            fetch(filePath)
                .then(response => {
                    if (!response.ok) throw new Error('File not found');
                    return response.text();
                })
                .then(md => {
                    // Remove YAML frontmatter
                    const content = md.replace(/^---[\s\S]*?---\n/, '');
                    document.getElementById('content').innerHTML = marked.parse(content);
                    document.getElementById('content').style.display = 'block';
                    document.getElementById('loading').style.display = 'none';

                    // Update title
                    const h1 = document.querySelector('.markdown-body h1');
                    if (h1) document.title = h1.textContent + ' — QuoNic';

                    // Generate TOC from headings
                    const headings = document.querySelectorAll('.markdown-body h2, .markdown-body h3');
                    const toc = document.getElementById('toc');
                    toc.innerHTML = '';
                    headings.forEach((h, i) => {
                        const id = 'heading-' + i;
                        h.id = id;
                        const link = document.createElement('a');
                        link.href = '#' + id;
                        link.textContent = h.textContent;
                        link.className = h.tagName === 'H3'
                            ? 'block text-slate-400 hover:text-doc-accent transition-colors py-1 pl-3'
                            : 'block text-slate-300 hover:text-doc-accent transition-colors py-1';
                        link.onclick = (e) => {
                            e.preventDefault();
                            h.scrollIntoView({ behavior: 'smooth', block: 'start' });
                        };
                        toc.appendChild(link);
                    });

                })
                .catch(err => {
                    document.getElementById('loading').textContent = 'Error loading document: ' + err.message;
                });
        } else {
            document.getElementById('loading').innerHTML = 'Select a document from the sidebar to get started.<br><br><a href="docs.html" style="color:#7aa2f7">← Back to Docs Home</a>';
        }
    </script>
</body>
</html>
