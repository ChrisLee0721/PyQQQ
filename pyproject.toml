[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "quonic"
version = "0.4.0"
description = "量子编程，像写 Python 一样简单"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "ChrisLee", email = "Christina_Llap_Yuen@outlook.com" }]
keywords = ["quantum", "quantum-computing", "qiskit", "cirq", "pennylane"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
qiskit = ["qiskit>=1.0", "qiskit-aer>=0.14"]
cirq = ["cirq>=1.0"]
pennylane = ["pennylane>=0.36"]
quantum-inspire = ["qiskit-quantuminspire>=0.18", "quantuminspire>=4.0", "qiskit<2.4.0"]
algorithms = ["numpy>=1.24", "scipy>=1.10"]
viz = ["matplotlib>=3.5"]
qulacs = ["qulacs>=0.6"]
tensorcircuit = ["tensorcircuit>=0.12"]
cudaq = ["cuda-quantum>=0.8"]
mindquantum = ["mindquantum>=0.9"]
qpanda = ["pyqpanda3>=3.0"]
cqlib = ["cqlib>=0.1"]
all-sim = ["quonic[qulacs,tensorcircuit,cudaq,mindquantum,qpanda,cqlib]"]
dev = ["pytest>=7.0", "numpy>=1.24", "scipy>=1.10", "matplotlib>=3.5", "ruff>=0.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
quonic = ["py.typed", "scheduler/data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
