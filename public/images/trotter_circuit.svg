<svg xmlns="http://www.w3.org/2000/svg" width="500" height="160" viewBox="-40.0 -30.0 570.0 220.0">
  <rect x="-40.0" y="-30.0" width="570.0" height="220.0" fill="#fff" stroke="#666" stroke-width="1" rx="4"/>
  <style>
    text { font-family: 'Consolas', 'Courier New', monospace; }
    .qubit-label { font-size: 14px; fill: #555; }
