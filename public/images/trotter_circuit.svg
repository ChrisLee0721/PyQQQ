  <line x1="100" y1="60" x2="400" y2="60" class="wire"/>
  <line x1="100" y1="120" x2="400" y2="120" class="wire"/>

  <rect x="-40.0" y="-30.0" width="570.0" height="220.0" fill="#fff" stroke="#666" stroke-width="1" rx="4"/>
