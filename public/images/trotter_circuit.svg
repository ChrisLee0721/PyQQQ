  <line x1="250" y1="60" x2="250" y2="120" class="conn-line"/>
  <circle cx="250" cy="60" r="3" class="control-dot"/>
  <circle cx="250" cy="120" r="11" class="target-circle"/>
  <line x1="239" y1="120" x2="261" y2="120" class="target-plus"/>
  <line x1="250" y1="109" x2="250" y2="131" class="target-plus"/>
  <rect x="-40.0" y="-30.0" width="570.0" height="220.0" fill="#fff" stroke="#666" stroke-width="1" rx="4"/>
  <text x="310" y="124" text-anchor="middle" class="gate-label" style="font-size: 9px;">Rz(θ)</text>
  <line x1="370" y1="60" x2="370" y2="120" class="conn-line"/>
