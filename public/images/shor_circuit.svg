<svg xmlns="http://www.w3.org/2000/svg" width="740" height="280" viewBox="-10 0 750 280">
  <rect width="100%" height="100%" fill="white" rx="8"/>
  <style>
    text { font-family: 'Consolas', 'Courier New', monospace; }
    .qubit-label { font-size: 14px; fill: #555; }
    .gate-label { font-size: 15px; fill: #222; font-weight: bold; }
    .annotation { font-size: 11px; fill: #888; }
    .wire { stroke: #bbb; stroke-width: 1.5; }
    .gate-box { fill: #fff; stroke: #333; stroke-width: 1.8; rx: 4; }
    .control-dot { fill: #333; }
    .target-circle { fill: #fff; stroke: #333; stroke-width: 1.8; }
    .target-plus { stroke: #333; stroke-width: 1.8; }
    .conn-line { stroke: #333; stroke-width: 1.8; }
    .title { font-size: 16px; fill: #333; font-weight: bold; }
    .measure-box { fill: #fff; stroke: #333; stroke-width: 1.8; }
  </style>

  <text x="370" y="24" text-anchor="middle" class="title">Shor's algorithm (simplified)</text>

  <text x="5" y="64" class="qubit-label">|q₀⟩</text>
  <text x="5" y="124" class="qubit-label">|q₁⟩</text>
  <text x="5" y="184" class="qubit-label">|q₂⟩</text>
  <text x="5" y="244" class="qubit-label">|q₃⟩</text>

  <line x1="100" y1="60" x2="640" y2="60" class="wire"/>
  <line x1="100" y1="120" x2="640" y2="120" class="wire"/>
  <line x1="100" y1="180" x2="640" y2="180" class="wire"/>
  <line x1="100" y1="240" x2="640" y2="240" class="wire"/>

  <rect x="120" y="48" width="20" height="24" class="gate-box"/>
  <text x="130" y="64" text-anchor="middle" class="gate-label" style="font-size: 10px;">H</text>
  <rect x="180" y="108" width="20" height="24" class="gate-box"/>
  <text x="190" y="124" text-anchor="middle" class="gate-label" style="font-size: 10px;">H</text>
  <rect x="240" y="168" width="20" height="24" class="gate-box"/>
  <text x="250" y="184" text-anchor="middle" class="gate-label" style="font-size: 10px;">H</text>
  <line x1="310" y1="60" x2="310" y2="240" class="conn-line"/>
  <circle cx="310" cy="60" r="3" class="control-dot"/>
  <circle cx="310" cy="240" r="11" class="target-circle"/>
  <line x1="299" y1="240" x2="321" y2="240" class="target-plus"/>
  <line x1="310" y1="229" x2="310" y2="251" class="target-plus"/>
  <line x1="370" y1="120" x2="370" y2="240" class="conn-line"/>
  <circle cx="370" cy="120" r="3" class="control-dot"/>
  <circle cx="370" cy="240" r="11" class="target-circle"/>
  <line x1="359" y1="240" x2="381" y2="240" class="target-plus"/>
  <line x1="370" y1="229" x2="370" y2="251" class="target-plus"/>
  <line x1="430" y1="180" x2="430" y2="240" class="conn-line"/>
  <circle cx="430" cy="180" r="3" class="control-dot"/>
  <circle cx="430" cy="240" r="11" class="target-circle"/>
  <line x1="419" y1="240" x2="441" y2="240" class="target-plus"/>
  <line x1="430" y1="229" x2="430" y2="251" class="target-plus"/>
  <rect x="480" y="48" width="20" height="24" class="gate-box"/>
  <text x="490" y="64" text-anchor="middle" class="gate-label" style="font-size: 10px;">H</text>
  <rect x="540" y="108" width="20" height="24" class="gate-box"/>
  <text x="550" y="124" text-anchor="middle" class="gate-label" style="font-size: 10px;">H</text>
  <rect x="600" y="168" width="20" height="24" class="gate-box"/>
  <text x="610" y="184" text-anchor="middle" class="gate-label" style="font-size: 10px;">H</text>
</svg>
