<svg xmlns="http://www.w3.org/2000/svg" width="560" height="220" viewBox="-40.0 -30.0 630.0 280.0">
  <rect x="-40.0" y="-30.0" width="630.0" height="280.0" fill="#fff" stroke="#666" stroke-width="1" rx="4"/>
  <style>
    text { font-family: 'Consolas', 'Courier New', monospace; }
    .qubit-label { font-size: 14px; fill: #555; }
    .gate-label { font-size: 15px; fill: #222; font-weight: bold; }
    .annotation { font-size: 11px; fill: #888; }
    .wire { stroke: #bbb; stroke-width: 1.5; }
    .gate-box { fill: #fff; stroke: #333; stroke-width: 1.8; rx: 4; }
    .control-dot { fill: #333; }
    .target-circle { fill: #fff; stroke: #333; stroke-width: 1.8; }
    .target-plus { stroke: #333; stroke-width: 1.8; }
    .conn-line { stroke: #333; stroke-width: 1.8; }
    .title { font-size: 16px; fill: #333; font-weight: bold; }
    .measure-box { fill: #fff; stroke: #333; stroke-width: 1.8; }
  </style>

  <text x="280" y="24" text-anchor="middle" class="title">Basic Gates circuit</text>

  <text x="5" y="64" class="qubit-label">|q0⟩</text>
  <text x="5" y="124" class="qubit-label">|q1⟩</text>
  <text x="5" y="184" class="qubit-label">|q2⟩</text>

  <line x1="100" y1="60" x2="460" y2="60" class="wire"/>
  <line x1="100" y1="120" x2="460" y2="120" class="wire"/>
  <line x1="100" y1="180" x2="460" y2="180" class="wire"/>

  <rect x="-40.0" y="-30.0" width="630.0" height="280.0" fill="#fff" stroke="#666" stroke-width="1" rx="4"/>
  <text x="130" y="64" text-anchor="middle" class="gate-label" style="font-size: 10px;">X</text>
  <rect x="-40.0" y="-30.0" width="630.0" height="280.0" fill="#fff" stroke="#666" stroke-width="1" rx="4"/>
  <text x="190" y="124" text-anchor="middle" class="gate-label" style="font-size: 10px;">X</text>
  <line x1="250" y1="60" x2="250" y2="120" class="conn-line"/>
  <circle cx="250" cy="60" r="3" class="control-dot"/>
  <circle cx="250" cy="120" r="3" class="control-dot"/>
  <rect x="-40.0" y="-30.0" width="630.0" height="280.0" fill="#fff" stroke="#666" stroke-width="1" rx="4"/>
  <text x="310" y="64" text-anchor="middle" class="gate-label" style="font-size: 10px;">Z</text>
  <rect x="-40.0" y="-30.0" width="630.0" height="280.0" fill="#fff" stroke="#666" stroke-width="1" rx="4"/>
  <text x="370" y="184" text-anchor="middle" class="gate-label" style="font-size: 10px;">Y</text>
  <rect x="-40.0" y="-30.0" width="630.0" height="280.0" fill="#fff" stroke="#666" stroke-width="1" rx="4"/>
  <text x="430" y="64" text-anchor="middle" class="gate-label" style="font-size: 10px;">M</text>
</svg>
