<svg xmlns="http://www.w3.org/2000/svg" width="420" height="160" viewBox="0 0 380 160">
  <rect width="100%" height="100%" fill="white"/>
  <style>
    text { font-family: 'Consolas', 'Courier New', monospace; }
    .qubit-label { font-size: 14px; fill: #555; }
    .gate-label { font-size: 15px; fill: #222; font-weight: bold; }
    .annotation { font-size: 11px; fill: #888; }
    .wire { stroke: #bbb; stroke-width: 1.5; }
    .gate-box { fill: #fff; stroke: #333; stroke-width: 1.8; rx: 4; }
    .control-dot { fill: #333; }
    .target-circle { fill: #fff; stroke: #333; stroke-width: 1.8; }
    .target-plus { stroke: #333; stroke-width: 1.8; }
    .conn-line { stroke: #333; stroke-width: 1.8; }
    .title { font-size: 16px; fill: #333; font-weight: bold; }
  </style>

  <!-- Title -->
  <text x="180" y="24" text-anchor="middle" class="title">Grover search circuit</text>

  <!-- Qubit labels -->
  <text x="0" y="64" class="qubit-label">|q₀⟩ = |0⟩</text>
  <text x="0" y="124" class="qubit-label">|q₁⟩ = |0⟩</text>

  <!-- Quantum wires -->
  <line x1="80" y1="60" x2="320" y2="60" class="wire"/>
  <line x1="80" y1="120" x2="320" y2="120" class="wire"/>

  <!-- H gate on q0 -->
  <rect x="100" y="48" width="20" height="20" class="gate-box"/>
  <text x="110" y="62" text-anchor="middle" class="gate-label" style="font-size: 10px;">H</text>

  <!-- H gate on q1 -->
  <rect x="100" y="108" width="20" height="20" class="gate-box"/>
  <text x="110" y="122" text-anchor="middle" class="gate-label" style="font-size: 10px;">H</text>

  <!-- Oracle: CZ gate -->
  <line x1="160" y1="60" x2="160" y2="120" class="conn-line"/>
  <circle cx="160" cy="60" r="3" class="control-dot"/>
  <circle cx="160" cy="120" r="3" class="control-dot"/>

  <!-- H gate on q0 -->
  <rect x="200" y="48" width="20" height="20" class="gate-box"/>
  <text x="210" y="62" text-anchor="middle" class="gate-label" style="font-size: 10px;">H</text>

  <!-- H gate on q1 -->
  <rect x="200" y="108" width="20" height="20" class="gate-box"/>
  <text x="210" y="122" text-anchor="middle" class="gate-label" style="font-size: 10px;">H</text>

  <!-- Diffusion: CZ gate -->
  <line x1="260" y1="60" x2="260" y2="120" class="conn-line"/>
  <circle cx="260" cy="60" r="3" class="control-dot"/>
  <circle cx="260" cy="120" r="3" class="control-dot"/>

  <!-- H gate on q0 -->
  <rect x="290" y="48" width="20" height="20" class="gate-box"/>
  <text x="300" y="62" text-anchor="middle" class="gate-label" style="font-size: 10px;">H</text>

  <!-- H gate on q1 -->
  <rect x="290" y="108" width="20" height="20" class="gate-box"/>
  <text x="300" y="122" text-anchor="middle" class="gate-label" style="font-size: 10px;">H</text>

  <!-- Annotations -->
  <text x="110" y="78" text-anchor="middle" class="annotation" style="font-size: 9px;">H</text>
  <text x="160" y="141" text-anchor="middle" class="annotation" style="font-size: 9px;">Oracle</text>
  <text x="210" y="78" text-anchor="middle" class="annotation" style="font-size: 9px;">H</text>
  <text x="260" y="141" text-anchor="middle" class="annotation" style="font-size: 9px;">Diffusion</text>
  <text x="300" y="78" text-anchor="middle" class="annotation" style="font-size: 9px;">H</text>

  <!-- Output state -->
  <foreignObject x="325" y="45" width="60" height="40">
    <math xmlns="http://www.w3.org/1998/Math/MathML" style="font-size: 10px;">
      <mo>|</mo><mn>11</mn><mo>⟩</mo>
    </math>
  </foreignObject>

  <foreignObject x="325" y="105" width="60" height="30">
    <math xmlns="http://www.w3.org/1998/Math/MathML" style="font-size: 10px;">
      <mo>~99%</mo>
    </math>
  </foreignObject>
</svg>
