<svg xmlns="http://www.w3.org/2000/svg" width="860" height="220" viewBox="-10 0 870 220">
  <rect x="-15.0" y="-5.0" width="880.0" height="230.0" fill="#fff" stroke="#ccc" stroke-width="1" rx="4"/>
  <style>
    text { font-family: 'Consolas', 'Courier New', monospace; }
