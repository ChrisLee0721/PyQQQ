<svg xmlns="http://www.w3.org/2000/svg" width="340" height="160" viewBox="-10 0 390 160">
  <rect width="100%" height="100%" fill="white" rx="8"/>
  <style>
    text { font-family: 'Consolas', 'Courier New', monospace; }
    .qubit-label { font-size: 14px; fill: #555; }
    .gate-label { font-size: 15px; fill: #222; font-weight: bold; }
    .annotation { font-size: 11px; fill: #888; }
    .wire { stroke: #bbb; stroke-width: 1.5; }
    .gate-box { fill: #fff; stroke: #333; stroke-width: 1.8; rx: 4; }
    .control-dot { fill: #333; }
    .target-circle { fill: #fff; stroke: #333; stroke-width: 1.8; }
    .target-plus { stroke: #333; stroke-width: 1.8; }
    .conn-line { stroke: #333; stroke-width: 1.8; }
    .title { font-size: 16px; fill: #333; font-weight: bold; }
  </style>

  <!-- Title -->
  <text x="180" y="24" text-anchor="middle" class="title">Bell state circuit</text>

  <!-- Qubit labels -->
  <text x="5" y="64" class="qubit-label">|q₀⟩ = |0⟩</text>
  <text x="5" y="124" class="qubit-label">|q₁⟩ = |0⟩</text>

  <!-- Quantum wires -->
  <line x1="80" y1="60" x2="250" y2="60" class="wire"/>
  <line x1="80" y1="120" x2="250" y2="120" class="wire"/>

  <!-- H gate -->
  <rect x="120" y="48" width="20" height="20" class="gate-box"/>
  <text x="130" y="62" text-anchor="middle" class="gate-label" style="font-size: 10px;">H</text>

  <!-- CNOT vertical line -->
  <line x1="200" y1="60" x2="200" y2="120" class="conn-line"/>

  <!-- CNOT control dot -->
  <circle cx="200" cy="60" r="3" class="control-dot"/>

  <!-- CNOT target (⊕) -->
  <circle cx="200" cy="120" r="11" class="target-circle"/>
  <line x1="189" y1="120" x2="211" y2="120" class="target-plus"/>
  <line x1="200" y1="109" x2="200" y2="131" class="target-plus"/>

  <!-- Annotations -->
  <text x="130" y="78" text-anchor="middle" class="annotation" style="font-size: 9px;">Hadamard</text>
  <text x="200" y="141" text-anchor="middle" class="annotation" style="font-size: 9px;">CNOT</text>

  <!-- Output state with MathML fraction -->
  <foreignObject x="255" y="45" width="100" height="40">
    <math xmlns="http://www.w3.org/1998/Math/MathML" style="font-size: 9px;">
      <mfrac>
        <mn>1</mn>
        <msqrt>
          <mn>2</mn>
        </msqrt>
      </mfrac>
      <mo>(</mo>
      <mrow>
        <mo>|</mo><mn>00</mn><mo>⟩</mo>
        <mo>+</mo>
        <mo>|</mo><mn>11</mn><mo>⟩</mo>
      </mrow>
      <mo>)</mo>
    </math>
  </foreignObject>

  <!-- Bell state label with MathML -->
  <foreignObject x="255" y="105" width="40" height="30">
    <math xmlns="http://www.w3.org/1998/Math/MathML" style="font-size: 12px;">
      <mo>|</mo>
      <msup>
        <mi>Φ</mi>
        <mo>+</mo>
      </msup>
      <mo>⟩</mo>
    </math>
  </foreignObject>
</svg>
