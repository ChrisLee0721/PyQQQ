<svg xmlns="http://www.w3.org/2000/svg" width="420" height="200" viewBox="0 0 380 200">
  <style>
    text { font-family: 'Consolas', 'Courier New', monospace; }
    .qubit-label { font-size: 14px; fill: #555; }
    .gate-label { font-size: 15px; fill: #222; font-weight: bold; }
    .annotation { font-size: 11px; fill: #888; }
    .wire { stroke: #bbb; stroke-width: 1.5; }
    .gate-box { fill: #fff; stroke: #333; stroke-width: 1.8; rx: 4; }
    .control-dot { fill: #333; }
    .target-circle { fill: #fff; stroke: #333; stroke-width: 1.8; }
    .target-plus { stroke: #333; stroke-width: 1.8; }
    .conn-line { stroke: #333; stroke-width: 1.8; }
    .title { font-size: 16px; fill: #333; font-weight: bold; }
  </style>

  <!-- Title -->
  <text x="180" y="24" text-anchor="middle" class="title">Quantum teleportation circuit</text>

  <!-- Qubit labels -->
  <text x="0" y="64" class="qubit-label">|q₀⟩ = |ψ⟩</text>
  <text x="0" y="124" class="qubit-label">|q₁⟩ = |0⟩</text>
  <text x="0" y="184" class="qubit-label">|q₂⟩ = |0⟩</text>

  <!-- Quantum wires -->
  <line x1="80" y1="60" x2="320" y2="60" class="wire"/>
  <line x1="80" y1="120" x2="320" y2="120" class="wire"/>
  <line x1="80" y1="180" x2="320" y2="180" class="wire"/>

  <!-- Ry gate on q0 (prepare state) -->
  <rect x="100" y="48" width="20" height="20" class="gate-box"/>
  <text x="110" y="62" text-anchor="middle" class="gate-label" style="font-size: 8px;">Ry</text>

  <!-- H gate on q1 -->
  <rect x="140" y="108" width="20" height="20" class="gate-box"/>
  <text x="150" y="122" text-anchor="middle" class="gate-label" style="font-size: 10px;">H</text>

  <!-- CNOT q1→q2 (Bell pair) -->
  <line x1="180" y1="120" x2="180" y2="180" class="conn-line"/>
  <circle cx="180" cy="120" r="3" class="control-dot"/>
  <circle cx="180" cy="180" r="11" class="target-circle"/>
  <line x1="169" y1="180" x2="191" y2="180" class="target-plus"/>
  <line x1="180" y1="169" x2="180" y2="191" class="target-plus"/>

  <!-- CNOT q0→q1 -->
  <line x1="220" y1="60" x2="220" y2="120" class="conn-line"/>
  <circle cx="220" cy="60" r="3" class="control-dot"/>
  <circle cx="220" cy="120" r="11" class="target-circle"/>
  <line x1="209" y1="120" x2="231" y2="120" class="target-plus"/>
  <line x1="220" y1="109" x2="220" y2="131" class="target-plus"/>

  <!-- H gate on q0 -->
  <rect x="250" y="48" width="20" height="20" class="gate-box"/>
  <text x="260" y="62" text-anchor="middle" class="gate-label" style="font-size: 10px;">H</text>

  <!-- CNOT q1→q2 (correction) -->
  <line x1="290" y1="120" x2="290" y2="180" class="conn-line"/>
  <circle cx="290" cy="120" r="3" class="control-dot"/>
  <circle cx="290" cy="180" r="11" class="target-circle"/>
  <line x1="279" y1="180" x2="301" y2="180" class="target-plus"/>
  <line x1="290" y1="169" x2="290" y2="191" class="target-plus"/>

  <!-- CZ q0→q2 (correction) -->
  <line x1="310" y1="60" x2="310" y2="180" class="conn-line"/>
  <circle cx="310" cy="60" r="3" class="control-dot"/>
  <circle cx="310" cy="180" r="3" class="control-dot"/>

  <!-- Annotations -->
  <text x="110" y="78" text-anchor="middle" class="annotation" style="font-size: 9px;">Ry(π/3)</text>
  <text x="150" y="141" text-anchor="middle" class="annotation" style="font-size: 9px;">H</text>
  <text x="180" y="200" text-anchor="middle" class="annotation" style="font-size: 9px;">Bell pair</text>
  <text x="220" y="141" text-anchor="middle" class="annotation" style="font-size: 9px;">CNOT</text>
  <text x="260" y="78" text-anchor="middle" class="annotation" style="font-size: 9px;">H</text>
  <text x="290" y="200" text-anchor="middle" class="annotation" style="font-size: 9px;">CNOT</text>
  <text x="310" y="200" text-anchor="middle" class="annotation" style="font-size: 9px;">CZ</text>

  <!-- Output state -->
  <foreignObject x="325" y="140" width="60" height="30">
    <math xmlns="http://www.w3.org/1998/Math/MathML" style="font-size: 10px;">
      <mo>|</mo><mi>ψ</mi><mo>⟩</mo>
    </math>
  </foreignObject>
</svg>
