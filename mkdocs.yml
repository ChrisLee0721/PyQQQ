site_name: QuoNic Documentation
site_description: Quantum programming, as simple as writing Python
site_url: https://chrislee0721.github.io/QuoNic/
repo_url: https://github.com/ChrisLee0721/QuoNic
repo_name: QuoNic

theme:
  name: material
  palette:
    - scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - content.code.annotate
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

exclude_docs: |
  local/**

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
            members_order: source
            docstring_style: google

nav:
  - Home: index.md
  - Quick Start: quickstart.md
  - API Reference:
    - Core IR: api/ir.md
    - Gates: api/gates.md
    - Backends: api/backends.md
    - Scheduler: api/scheduler.md
    - Compiler: api/compiler.md
    - Noise: api/noise.md
    - ZNE: api/zne.md
    - Readout: api/readout.md
    - Visualization: api/viz.md
    - Machine Learning: api/ml.md
    - Error Correction: api/qec.md
    - Pulse Control: api/pulse.md
    - Distributed: api/distributed.md
    - ZX-Calculus: api/zx.md
  - Tutorials:
    - 01 Basics:
      - English: tutorials/01_basics/01_basics.md
      - 中文: tutorials/01_basics/01_basics_zh.md
    - 02 Algorithms:
      - English: tutorials/02_algorithms/02_algorithms.md
      - 中文: tutorials/02_algorithms/02_algorithms_zh.md
    - 03 Noise Mitigation:
      - English: tutorials/03_noise_mitigation/03_noise_mitigation.md
      - 中文: tutorials/03_noise_mitigation/03_noise_mitigation_zh.md
    - 04 GPU Acceleration:
      - English: tutorials/04_gpu_acceleration/04_gpu_acceleration.md
      - 中文: tutorials/04_gpu_acceleration/04_gpu_acceleration_zh.md
    - 05 Advanced:
      - English: tutorials/05_advanced/05_advanced.md
      - 中文: tutorials/05_advanced/05_advanced_zh.md
  - Examples: examples.md
  - Benchmarks: benchmarks.md
  - Changelog: changelog.md
  - Contributing: contributing.md
